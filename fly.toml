# fly.toml app configuration file generated for asr-tsonga-app on 2026-09-06T07:41:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'asr-tsonga-app'
primary_region = 'jnb'
swap_size_mb = 506

[build]

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
  strategy = 'immediate'
